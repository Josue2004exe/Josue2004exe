<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="100%">
  <defs>
    <!-- Fondo Gradiente Nocturno Premium -->
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Gradiente Cyan Neón -->
    <linearGradient id="neonCyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <!-- Resplandor Neón Superior -->
    <linearGradient id="topGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <style>
    .hero-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 5px;
      fill: #FFFFFF;
    }
    .hero-tag {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      fill: #00F5FF;
    }
    .hero-subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #94A3B8;
    }
    .hero-bullets {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #64748B;
    }
    .cyan-dot {
      fill: #00F5FF;
    }
  </style>

  <!-- Contenedor Base -->
  <rect width="900" height="180" rx="10" fill="url(#bgGrad2)"/>

  <!-- Borde Superior de Luz -->
  <rect x="0" y="0" width="900" height="2" fill="url(#topGlow)"/>

  <!-- Marco Exterior Delgado -->
  <rect x="1" y="1" width="898" height="178" rx="9" fill="none" stroke="rgba(255, 255, 255, 0.07)" stroke-width="1"/>

  <!-- Insignia Superior: 5TO SEMESTRE -->
  <g transform="translate(450, 32)">
    <rect x="-120" y="-11" width="240" height="22" rx="11" fill="rgba(0, 245, 255, 0.05)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
    <text x="0" y="3.5" text-anchor="middle" class="hero-tag">5TO SEMESTRE // VIBE CODING</text>
  </g>

  <!-- Título Principal -->
  <g transform="translate(450, 84)">
    <text x="0" y="0" text-anchor="middle" class="hero-title">FLAVIO MORALES</text>
  </g>

  <!-- Línea Gradiente Divisoria -->
  <rect x="375" y="98" width="150" height="2" rx="1" fill="url(#neonCyanGrad)"/>

  <!-- Subtítulo de Especialidad -->
  <g transform="translate(450, 126)">
    <text x="0" y="0" text-anchor="middle" class="hero-subtitle">
      ANDROID DEVELOPER <tspan class="cyan-dot">•</tspan> SYSTEM OPTIMIZATION <tspan class="cyan-dot">•</tspan> AI BUILDER
    </text>
  </g>

  <!-- Tecnologías Clave -->
  <g transform="translate(450, 154)">
    <text x="0" y="0" text-anchor="middle" class="hero-bullets">
      [ KOTLIN &amp; COMPOSE ] &nbsp;&nbsp; [ WINDOWS TUNING ] &nbsp;&nbsp; [ CLEAN CODE ]
    </text>
  </g>
</svg>
