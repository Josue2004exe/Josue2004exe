<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo refinado y oscuro -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070E"/>
      <stop offset="50%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#0E162B"/>
    </linearGradient>

    <!-- Gradiente Neón Acentuado Cyan & Violeta -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="60%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Gradiente Suave para Líneas de Luz -->
    <linearGradient id="glowLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>

    <!-- Resplandor ambiental de fondo -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    .font-logo {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 800;
      letter-spacing: 2px;
      fill: #00F5FF;
    }
    .font-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 40px;
      font-weight: 900;
      letter-spacing: 4px;
      fill: #FFFFFF;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2.5px;
      fill: #94A3B8;
    }
    .font-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Inter', monospace;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1.2px;
      fill: #CBD5E1;
    }
    .font-chip-accent {
      fill: #00F5FF;
      font-weight: 700;
    }
    .dot {
      fill: #00F5FF;
    }
  </style>

  <!-- Fondo Minimalista -->
  <rect width="920" height="200" rx="12" fill="url(#bgGradient)"/>
  
  <!-- Resplandor Central Sutil -->
  <rect width="920" height="200" rx="12" fill="url(#ambientGlow)"/>

  <!-- Borde Superior Neón Fino -->
  <rect x="0" y="0" width="920" height="1.5" fill="url(#glowLine)"/>

  <!-- Borde General Sutil -->
  <rect x="1" y="1" width="918" height="198" rx="11" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Líneas Geométricas de Acento (Minimalistas) -->
  <g opacity="0.15" stroke="#00F5FF" stroke-width="1">
    <line x1="60" y1="35" x2="160" y2="35"/>
    <line x1="60" y1="35" x2="60" y2="75"/>
    <line x1="860" y1="165" x2="760" y2="165"/>
    <line x1="860" y1="165" x2="860" y2="125"/>
  </g>

  <!-- Tag Superior: 5TO SEMESTRE • VIBE CODING -->
  <g transform="translate(460, 36)">
    <rect x="-135" y="-13" width="270" height="24" rx="12" fill="rgba(0, 245, 255, 0.06)" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/>
    <circle cx="-110" cy="-1" r="3" class="dot"/>
    <text x="5" y="3" text-anchor="middle" class="font-pill">
      <tspan class="font-chip-accent">5TO SEMESTRE</tspan> // VIBE CODING
    </text>
  </g>

  <!-- TÍTULO PRINCIPAL: FLAVIO MORALES -->
  <g transform="translate(460, 92)">
    <text x="0" y="0" text-anchor="middle" class="font-name">FLAVIO MORALES</text>
  </g>

  <!-- Línea Divisoria Gradiente -->
  <rect x="380" y="106" width="160" height="2" rx="1" fill="url(#accentGrad)"/>

  <!-- SUBTÍTULO: ANDROID DEVELOPER • SOFTWARE OPTIMIZATION -->
  <g transform="translate(460, 134)">
    <text x="0" y="0" text-anchor="middle" class="font-sub">
      ANDROID DEVELOPER <tspan fill="#00F5FF">•</tspan> SYSTEM OPTIMIZATION <tspan fill="#00F5FF">•</tspan> AI BUILDER
    </text>
  </g>

  <!-- FOOTER CHIPS (Estilo elegante, sin emojis rotos) -->
  <g transform="translate(460, 168)">
    <text x="0" y="0" text-anchor="middle" class="font-pill">
      [ KOTLIN &amp; COMPOSE ] &nbsp;&nbsp; [ LOW LATENCY TUNING ] &nbsp;&nbsp; [ CLEAN ARCHITECTURE ]
    </text>
  </g>
</svg>
